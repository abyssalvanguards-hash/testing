name: Hydrogen Python CI

on:
  push:
    branches:
      - hydrogen/multiguild-server-builder
  pull_request:
    branches:
      - hydrogen/slot-recovery-setup

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Hydrogen_UltimateBot/requirements.txt
          pip install pytest
      - name: Compile all Python modules
        working-directory: Hydrogen_UltimateBot
        run: python -m compileall -q .
      - name: Run unit tests
        working-directory: Hydrogen_UltimateBot
        run: pytest -q
